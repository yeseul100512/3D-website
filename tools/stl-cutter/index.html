<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="STL 모델을 프린터 출력 가능 크기에 맞춰 자동으로 여러 조각으로 절단합니다. 톱니(핑거 조인트) 절단면 지원, 브라우저에서 바로 실행.">
<title>STL 분할 프로그램 (프린터 크기 자동 절단)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #161826; --color-surface: #232532; --color-text: #e9e9ed;
    --color-accent: #9184d9; --color-accent-300: #d2cefd; --color-accent-400: #b5abfc;
    --color-accent-700: #5d5294; --color-accent-900: #2b2741;
    --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);
    --color-neutral-400: #b2b6ca; --color-neutral-500: #9397ab; --color-neutral-600: #75798c;
    --color-neutral-700: #595d6c; --color-neutral-800: #3f424d;
    --font-heading: 'Gowun Batang', 'Hiragino Mincho ProN', 'Songti SC', 'Inter', serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --radius-sm: 4px; --radius-md: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 22.4px 22.4px 33.6px; }
  .back { display: inline-flex; align-items: center; gap: 5.6px; margin-bottom: 16.8px; font-size: 12px; color: var(--color-neutral-500); text-decoration: none; }
  .back:hover { color: var(--color-accent-300); }
  .head { display: flex; align-items: flex-start; gap: 11.2px; margin-bottom: 16.8px; }
  .head i { font-size: 24px; color: var(--color-accent-400); margin-top: 2px; }
  .head h1 { flex: 1; margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: 20px; letter-spacing: -0.005em; }
  .badge { display: flex; align-items: center; gap: 5.6px; padding: 4px 10px; border: 1px solid var(--color-neutral-800); border-radius: 999px; background: var(--color-surface); }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  .badge span { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-500); }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16.8px; align-items: start; }
  .viewer-frame { position: relative; min-height: 460px; border: 1px solid var(--color-neutral-800); border-radius: var(--radius-md); background: radial-gradient(120% 90% at 50% 0%, #1c1f31 0%, #14162200 70%), var(--color-bg); overflow: hidden; }
  .viewer-frame .vgrid { position: absolute; inset: 0; background-image: linear-gradient(color-mix(in srgb, var(--color-text) 5%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--color-text) 5%, transparent) 1px, transparent 1px); background-size: 40px 40px; mask-image: radial-gradient(70% 70% at 50% 45%, #000 0%, transparent 100%); }
  .viewer-frame .vplaceholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8.4px; color: var(--color-neutral-600); }
  .viewer-frame .vplaceholder i { font-size: 32px; }
  .viewer-frame .vplaceholder span { font-size: 12px; }
  .orbit-hint { position: absolute; left: 11.2px; bottom: 11.2px; display: flex; align-items: center; gap: 5.6px; padding: 4px 9px; background: color-mix(in srgb, var(--color-surface) 85%, transparent); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-sm); font-size: 11px; color: var(--color-neutral-500); }
  .viewer-frame canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }

  .panel { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; align-items: start; gap: 16.8px 22.4px; padding: 16.8px; background: var(--color-surface); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-md); overflow-y: auto; max-height: 700px; }
  .section { display: flex; flex-direction: column; gap: 8.4px; }
  .section h2 { margin: 0; padding-bottom: 5.6px; border-bottom: 1px solid var(--color-divider); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-300); font-weight: 500; }

  .upload { display: flex; align-items: center; gap: 11.2px; padding: 14px; border: 1px dashed var(--color-neutral-700); border-radius: var(--radius-md); background: color-mix(in srgb, var(--color-bg) 60%, transparent); cursor: pointer; }
  .upload:hover { border-color: var(--color-accent-700); }
  .upload i { font-size: 18px; color: var(--color-accent-400); flex-shrink: 0; }
  .upload .t { font-size: 13px; }
  .upload .n { font-size: 11px; color: var(--color-neutral-600); margin-top: 2px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

  .numrow { display: flex; align-items: center; gap: 11.2px; }
  .numrow label { flex: 1; font-size: 12px; color: var(--color-neutral-400); }
  .numrow .field { display: flex; align-items: center; gap: 5.6px; }
  .numrow input[type=number] { width: 76px; padding: 5px 8px; text-align: right; background: var(--color-bg); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-sm); color: var(--color-text); font-family: var(--font-body); font-size: 13px; outline: none; }
  .numrow input[type=number]:focus { border-color: var(--color-accent); }
  .numrow .unit { width: 42px; font-size: 11px; color: var(--color-neutral-600); }

  .choice { display: flex; align-items: flex-start; gap: 8.4px; padding: 9px 11.2px; border: 1px solid var(--color-neutral-800); border-radius: var(--radius-sm); cursor: pointer; }
  .choice:has(input:checked) { border-color: var(--color-accent-700); background: color-mix(in srgb, var(--color-accent-900) 55%, transparent); }
  .choice input { position: absolute; opacity: 0; width: 0; height: 0; }
  .choice i { font-size: 15px; color: var(--color-accent-400); margin-top: 1px; }
  .choice .t { font-size: 12.5px; }
  .choice .n { font-size: 11px; color: var(--color-neutral-600); line-height: 1.4; }

  .hint { margin: 0; font-size: 11px; line-height: 1.5; color: var(--color-neutral-600); }
  .empty { padding: 14px; text-align: center; font-size: 12px; color: var(--color-neutral-700); border: 1px solid var(--color-divider); border-radius: var(--radius-sm); }

  button.primary, button.ghost { width: 100%; display: flex; align-items: center; justify-content: center; gap: 5.6px; padding: 9px; border-radius: var(--radius-md); font-size: 13px; cursor: pointer; font-family: var(--font-body); }
  button.primary { background: transparent; color: var(--color-accent); border: 1px solid var(--color-accent); }
  button.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--color-accent) 14%, transparent); }
  button.primary:disabled { color: var(--color-neutral-600); border-color: var(--color-neutral-800); cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--color-neutral-400); border: 1px solid var(--color-neutral-800); }
  button.ghost:hover:not(:disabled) { border-color: var(--color-neutral-600); color: var(--color-text); }

  #status { font-size: 12px; color: var(--color-accent-300); min-height: 16px; white-space: pre-wrap; }
  #summary { font-size: 12px; color: var(--color-neutral-400); line-height: 1.6; white-space: pre-wrap; }
  .checkrow { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-neutral-400); }
  .piece-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--color-divider); }
  .piece-row span { color: var(--color-neutral-500); }
  .piece-row button { width: auto; padding: 4px 10px; font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../"><i class="ph ph-arrow-left"></i><span>전체 도구</span></a>

  <div class="head">
    <i class="ph ph-scissors"></i>
    <h1>STL 분할</h1>
    <div class="badge"><span class="dot"></span><span>프린터 크기 자동 절단</span></div>
  </div>

  <div class="grid">
    <div class="viewer-frame">
      <div class="vgrid"></div>
      <div class="vplaceholder" id="viewerPlaceholder"><i class="ph ph-cube"></i><span>3D 미리보기 영역</span></div>
      <div id="viewer" style="position:absolute; inset:0;"></div>
      <div class="orbit-hint"><i class="ph ph-arrows-clockwise"></i><span>드래그로 회전</span></div>
    </div>

    <div class="panel">
      <div class="section">
        <label class="upload" for="fileInput">
          <i class="ph ph-upload-simple"></i>
          <div>
            <div class="t">STL 파일 선택</div>
            <div class="n" id="origInfo">선택하면 원본 치수가 표시됩니다</div>
          </div>
        </label>
        <input type="file" id="fileInput" accept=".stl">
      </div>

      <div class="section">
        <h2>프린터 출력 가능 크기</h2>
        <div class="numrow"><label>베드 가로 (X)</label><div class="field"><input type="number" id="pX" value="200" min="1"><span class="unit">mm</span></div></div>
        <div class="numrow"><label>베드 세로 (Y)</label><div class="field"><input type="number" id="pY" value="200" min="1"><span class="unit">mm</span></div></div>
        <div class="numrow"><label>최대 높이 (Z)</label><div class="field"><input type="number" id="pZ" value="200" min="1"><span class="unit">mm</span></div></div>
        <div class="numrow"><label>안전 여백</label><div class="field"><input type="number" id="margin" value="2" min="0"><span class="unit">mm</span></div></div>
        <p class="hint">베드 가장자리 여유. 실제 사용 크기 = 입력값 − 여백×2</p>
      </div>

      <div class="section">
        <h2>절단면 방식</h2>
        <label class="choice">
          <input type="radio" name="jointMode" id="modeTeeth" value="teeth" checked>
          <i class="ph ph-puzzle-piece"></i>
          <div><div class="t">톱니 (핑거 조인트)</div><div class="n">서로 맞물려 조립 시 정렬됨</div></div>
        </label>
        <label class="choice">
          <input type="radio" name="jointMode" id="modeFlat" value="flat">
          <i class="ph ph-minus"></i>
          <div><div class="t">직선 단면</div><div class="n">평평하게만 자름 (접착 전제)</div></div>
        </label>
        <div id="toothParams">
          <div class="numrow"><label>이빨 폭</label><div class="field"><input type="number" id="toothWidth" value="15" min="2" step="0.5"><span class="unit">mm</span></div></div>
          <div class="numrow"><label>이빨 깊이</label><div class="field"><input type="number" id="toothDepth" value="4" min="0.5" step="0.5"><span class="unit">mm</span></div></div>
          <div class="numrow"><label>조립 여유</label><div class="field"><input type="number" id="clearance" value="0.3" min="0" step="0.05"><span class="unit">mm</span></div></div>
        </div>
        <p class="hint">절단면 자체를 톱니(핑거 조인트) 모양으로 잘라 서로 맞물리게 합니다. 레이저 커터의 박스 조인트와 같은 방식이라 속이 빈 얇은 벽에도 그대로 적용됩니다.</p>
      </div>

      <div class="section">
        <button class="primary" id="runBtn" disabled><i class="ph ph-scissors"></i><span>분석 후 절단 실행</span></button>
        <div id="status"></div>
        <div id="summary"></div>
      </div>

      <div class="section">
        <div class="checkrow" id="explodeRow" style="display:none">
          <input type="checkbox" id="explodeChk">
          <label for="explodeChk">분해 보기 (조각 간격 벌려서 미리보기, 실제 파일엔 영향 없음)</label>
        </div>
        <h2 id="piecesHeader" style="display:none">조각 목록</h2>
        <button class="ghost" id="zipBtn" style="display:none"><i class="ph ph-file-zip"></i><span>전체 ZIP으로 다운로드</span></button>
        <div id="pieceList"></div>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.179.0/build/three.module.js",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.179.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.7/build/index.module.js",
    "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.18/src/index.js"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { STLLoader } from 'three/examples/jsm/loaders/STLLoader.js';
import { STLExporter } from 'three/examples/jsm/exporters/STLExporter.js';
import { Brush, Evaluator, ADDITION, SUBTRACTION, INTERSECTION } from 'three-bvh-csg';
import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';

THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

// ---------- viewer setup ----------
const viewerEl = document.getElementById('viewer');
const viewerPlaceholder = document.getElementById('viewerPlaceholder');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161826);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1e6);
const renderer = new THREE.WebGLRenderer({ antialias: true });
viewerEl.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(1, 1, 1);
scene.add(dirLight);
const orbit = new OrbitControls(camera, renderer.domElement);

function resize() {
  const w = viewerEl.clientWidth, h = viewerEl.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
(function animate() {
  requestAnimationFrame(animate);
  orbit.update();
  renderer.render(scene, camera);
})();

let displayGroup = new THREE.Group();
scene.add(displayGroup);

function frameCameraToBox(box) {
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const dist = maxDim * 2.2;
  camera.position.set(center.x + dist, center.y + dist, center.z + dist);
  orbit.target.copy(center);
  camera.near = maxDim / 100;
  camera.far = maxDim * 100;
  camera.updateProjectionMatrix();
  orbit.update();
}

// ---------- state ----------
let rawGeometry = null;   // as loaded, untouched
let baseName = 'model';
let pieces = null;        // Map key "i,j,k" -> { geometry, box:{minX..}, index:[i,j,k] }
let gridN = [1, 1, 1];

const els = {
  fileInput: document.getElementById('fileInput'),
  origInfo: document.getElementById('origInfo'),
  pX: document.getElementById('pX'), pY: document.getElementById('pY'), pZ: document.getElementById('pZ'),
  margin: document.getElementById('margin'),
  toothWidth: document.getElementById('toothWidth'), toothDepth: document.getElementById('toothDepth'),
  clearance: document.getElementById('clearance'), toothParams: document.getElementById('toothParams'),
  runBtn: document.getElementById('runBtn'),
  status: document.getElementById('status'),
  summary: document.getElementById('summary'),
  explodeRow: document.getElementById('explodeRow'), explodeChk: document.getElementById('explodeChk'),
  piecesHeader: document.getElementById('piecesHeader'),
  zipBtn: document.getElementById('zipBtn'),
  pieceList: document.getElementById('pieceList'),
};

els.fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  baseName = file.name.replace(/\.stl$/i, '');
  const reader = new FileReader();
  reader.onload = (ev) => loadSTL(ev.target.result);
  reader.readAsArrayBuffer(file);
});

function loadSTL(arrayBuffer) {
  viewerPlaceholder.style.display = 'none';
  rawGeometry = new STLLoader().parse(arrayBuffer);
  rawGeometry.computeBoundingBox();
  const bb = rawGeometry.boundingBox;
  const size = [bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z];
  els.origInfo.textContent = `원본 크기 (mm): 가로 ${size[0].toFixed(1)} x 세로 ${size[1].toFixed(1)} x 높이 ${size[2].toFixed(1)}`;

  displayGroup.clear();
  const mesh = new THREE.Mesh(rawGeometry, new THREE.MeshStandardMaterial({ color: 0x9184d9, metalness: 0.1, roughness: 0.6 }));
  displayGroup.add(mesh);
  frameCameraToBox(new THREE.Box3().setFromObject(mesh));

  els.runBtn.disabled = false;
  els.summary.textContent = '';
  els.piecesHeader.style.display = 'none';
  els.zipBtn.style.display = 'none';
  els.explodeRow.style.display = 'none';
  els.pieceList.innerHTML = '';
  pieces = null;
}

document.querySelectorAll('input[name=jointMode]').forEach(r => r.addEventListener('change', () => {
  els.toothParams.style.display = document.querySelector('input[name=jointMode]:checked').value === 'teeth' ? 'block' : 'none';
}));

els.runBtn.addEventListener('click', () => {
  els.runBtn.disabled = true;
  els.status.textContent = '처리 중... (모델이 복잡하면 시간이 걸릴 수 있습니다)';
  requestAnimationFrame(() => requestAnimationFrame(runCut));
});

// ---------- orientation search ----------
const PERMS = [
  { p: [0, 1, 2], sign: 1 },
  { p: [0, 2, 1], sign: -1 },
  { p: [1, 0, 2], sign: -1 },
  { p: [1, 2, 0], sign: 1 },
  { p: [2, 0, 1], sign: 1 },
  { p: [2, 1, 0], sign: -1 },
];
const AXIS_NAME = ['가로(X)', '세로(Y)', '높이(Z)'];

function pickBestOrientation(size, effX, effY, effZ) {
  let best = null;
  for (const { p, sign } of PERMS) {
    const rDim = [size[p[0]], size[p[1]], size[p[2]]];
    const eff = [effX, effY, effZ];
    const n = rDim.map((d, i) => Math.max(1, Math.ceil(d / eff[i] - 1e-9)));
    const total = n[0] * n[1] * n[2];
    const cutAxes = n.filter(v => v > 1).length;
    const isIdentity = p[0] === 0 && p[1] === 1 && p[2] === 2;
    const key = { total, cutAxes, isIdentity: isIdentity ? 0 : 1 };
    if (!best || key.total < best.key.total ||
        (key.total === best.key.total && key.cutAxes < best.key.cutAxes) ||
        (key.total === best.key.total && key.cutAxes === best.key.cutAxes && key.isIdentity < best.key.isIdentity)) {
      best = { p, sign, rDim, n, key };
    }
  }
  return best;
}

function buildRotationMatrix(p, sign) {
  const m = new Array(9).fill(0);
  for (let row = 0; row < 3; row++) m[row * 3 + p[row]] = 1;
  if (sign === -1) { m[6] *= -1; m[7] *= -1; m[8] *= -1; } // flip row 2 (z)
  return new THREE.Matrix4().set(
    m[0], m[1], m[2], 0,
    m[3], m[4], m[5], 0,
    m[6], m[7], m[8], 0,
    0, 0, 0, 1
  );
}

// ---------- CSG helpers ----------
const evaluator = new Evaluator();
evaluator.attributes = ['position', 'normal']; // STL geometry has no uv attribute
function brushOf(geom) {
  const b = new Brush(geom);
  b.updateMatrixWorld();
  return b;
}
function runCut() {
  try {
    rawGeometry.computeBoundingBox();
    const bb0 = rawGeometry.boundingBox;
    const size = [bb0.max.x - bb0.min.x, bb0.max.y - bb0.min.y, bb0.max.z - bb0.min.z];

    const margin = parseFloat(els.margin.value) || 0;
    const printer = [parseFloat(els.pX.value), parseFloat(els.pY.value), parseFloat(els.pZ.value)];
    const eff = printer.map(v => v - 2 * margin);
    if (eff.some(v => v <= 0)) { alert('안전 여백을 뺀 실제 사용 크기가 0 이하입니다. 값을 확인하세요.'); els.runBtn.disabled = false; els.status.textContent = ''; return; }

    const best = pickBestOrientation(size, eff[0], eff[1], eff[2]);
    gridN = best.n;

    // bake rotation into a fresh geometry, then move min corner to origin
    const geom = rawGeometry.clone();
    geom.applyMatrix4(buildRotationMatrix(best.p, best.sign));
    geom.computeBoundingBox();
    const bb = geom.boundingBox;
    geom.applyMatrix4(new THREE.Matrix4().makeTranslation(-bb.min.x, -bb.min.y, -bb.min.z));
    geom.computeBoundingBox();
    const dims = [geom.boundingBox.max.x, geom.boundingBox.max.y, geom.boundingBox.max.z];
    geom.computeBoundsTree();

    const mapLines = [0, 1, 2].map(k => `  원본 ${AXIS_NAME[best.p[k]]} (${size[best.p[k]].toFixed(1)}mm) → 프린터 ${AXIS_NAME[k]}`).join('\n');

    if (gridN[0] === 1 && gridN[1] === 1 && gridN[2] === 1) {
      pieces = new Map();
      pieces.set('0,0,0', { geometry: geom, index: [0, 0, 0], box: { cx: dims[0] / 2, cy: dims[1] / 2, cz: dims[2] / 2 } });
      els.summary.textContent = `회전만으로 프린터 크기에 맞습니다. 절단 불필요.\n${mapLines}`;
    } else {
      const cellSize = [dims[0] / gridN[0], dims[1] / gridN[1], dims[2] / gridN[2]];
      const jointMode = document.querySelector('input[name=jointMode]:checked').value;
      const toothWidth = parseFloat(els.toothWidth.value);
      const toothDepth = parseFloat(els.toothDepth.value);
      const clearance = parseFloat(els.clearance.value);
      pieces = cutIntoGrid(geom, gridN, cellSize, jointMode, toothWidth, toothDepth, clearance);
      const modeLabel = jointMode === 'teeth' ? '톱니(핑거 조인트)' : '직선 단면';
      els.summary.textContent =
        `총 ${pieces.size}개 조각 (X:${gridN[0]}분할 x Y:${gridN[1]}분할 x Z:${gridN[2]}분할, ${modeLabel})\n${mapLines}`;
    }

    showPieces();
    els.status.textContent = '완료';
  } catch (err) {
    console.error(err);
    els.status.textContent = '오류: ' + err.message + ' (모델이 완전히 닫힌 solid(watertight)가 아닐 수 있습니다)';
  } finally {
    els.runBtn.disabled = false;
  }
}

// Builds an axis-aligned box geometry from per-axis [min,max] ranges given as (axis, combAxis, keepAxis) triples.
function buildAxisBox(axis, combAxis, keepAxis, aMin, aMax, uMin, uMax, vMin, vMax) {
  const min = [0, 0, 0], max = [0, 0, 0];
  min[axis] = aMin; max[axis] = aMax;
  min[combAxis] = uMin; max[combAxis] = uMax;
  min[keepAxis] = vMin; max[keepAxis] = vMax;
  const w = max[0] - min[0], h = max[1] - min[1], d = max[2] - min[2];
  const cx = (min[0] + max[0]) / 2, cy = (min[1] + max[1]) / 2, cz = (min[2] + max[2]) / 2;
  return new THREE.BoxGeometry(w, h, d).translate(cx, cy, cz);
}

// One internal face of a cell: alternating tabs (added) / notches (subtracted) along combAxis, full-span along keepAxis.
// role 'max' = this cell is the lower side of the interface (its box normally ends at `plane`).
// role 'min' = this cell is the upper side of the interface (its box normally starts at `plane`).
function addFaceTeeth(ops, axis, combAxis, keepAxis, plane, uMin, uMax, vMin, vMax, toothWidth, toothDepth, clearance, role) {
  const segStart = Math.floor(uMin / toothWidth);
  const segEnd = Math.ceil(uMax / toothWidth);
  for (let s = segStart; s < segEnd; s++) {
    const su0 = Math.max(uMin, s * toothWidth), su1 = Math.min(uMax, (s + 1) * toothWidth);
    if (su1 - su0 < 0.5) continue;
    const even = (((s % 2) + 2) % 2) === 0;
    let type, aMin, aMax, shrink;
    if (role === 'max') {
      if (even) { type = 'add'; aMin = plane; aMax = plane + toothDepth - clearance / 2; shrink = clearance / 2; }
      else { type = 'sub'; aMin = plane - toothDepth; aMax = plane; shrink = 0; }
    } else {
      if (even) { type = 'sub'; aMin = plane; aMax = plane + toothDepth; shrink = 0; }
      else { type = 'add'; aMin = plane - toothDepth + clearance / 2; aMax = plane; shrink = clearance / 2; }
    }
    if (aMax - aMin < 0.2 || su1 - shrink - (su0 + shrink) < 0.2) continue;
    ops.push({ type, geom: buildAxisBox(axis, combAxis, keepAxis, aMin, aMax, su0 + shrink, su1 - shrink, vMin, vMax) });
  }
}

function buildCombOpsForCell(idxArr, n, cellSize, toothWidth, toothDepth, clearance) {
  const ops = [];
  for (let axis = 0; axis < 3; axis++) {
    if (n[axis] < 2) continue;
    const oa = [0, 1, 2].filter(a => a !== axis);
    const combLocal = cellSize[oa[0]] >= cellSize[oa[1]] ? 0 : 1; // comb along the wider of the two, for more/sturdier teeth
    const combAxis = oa[combLocal], keepAxis = oa[1 - combLocal];
    const uMin = idxArr[combAxis] * cellSize[combAxis], uMax = uMin + cellSize[combAxis];
    const vMin = idxArr[keepAxis] * cellSize[keepAxis], vMax = vMin + cellSize[keepAxis];

    if (idxArr[axis] > 0) {
      addFaceTeeth(ops, axis, combAxis, keepAxis, idxArr[axis] * cellSize[axis], uMin, uMax, vMin, vMax, toothWidth, toothDepth, clearance, 'min');
    }
    if (idxArr[axis] < n[axis] - 1) {
      addFaceTeeth(ops, axis, combAxis, keepAxis, (idxArr[axis] + 1) * cellSize[axis], uMin, uMax, vMin, vMax, toothWidth, toothDepth, clearance, 'max');
    }
  }
  return ops;
}

function cutIntoGrid(geom, n, cellSize, jointMode, toothWidth, toothDepth, clearance) {
  const meshBrush = brushOf(geom);
  const out = new Map();
  const EPS = 0.05;
  for (let i = 0; i < n[0]; i++) for (let j = 0; j < n[1]; j++) for (let k = 0; k < n[2]; k++) {
    const idxArr = [i, j, k];
    const min = [i * cellSize[0], j * cellSize[1], k * cellSize[2]];
    const max = [(i + 1) * cellSize[0], (j + 1) * cellSize[1], (k + 1) * cellSize[2]];
    for (let a = 0; a < 3; a++) {
      if (idxArr[a] === 0) min[a] -= EPS; // outer faces always get a hair of overlap padding
      if (idxArr[a] === n[a] - 1) max[a] += EPS;
      if (jointMode === 'flat') { // no teeth to interlock the pieces, so pad internal faces too
        if (idxArr[a] > 0) min[a] -= EPS;
        if (idxArr[a] < n[a] - 1) max[a] += EPS;
      }
    }
    const w = max[0] - min[0], h = max[1] - min[1], d = max[2] - min[2];
    const cx = (min[0] + max[0]) / 2, cy = (min[1] + max[1]) / 2, cz = (min[2] + max[2]) / 2;
    let cutGeom = new THREE.BoxGeometry(w, h, d).translate(cx, cy, cz);

    const teethOps = jointMode === 'teeth' ? buildCombOpsForCell(idxArr, n, cellSize, toothWidth, toothDepth, clearance) : [];
    if (teethOps.length) {
      let current = brushOf(cutGeom);
      for (const op of teethOps) {
        const result = evaluator.evaluate(current, brushOf(op.geom), op.type === 'add' ? ADDITION : SUBTRACTION);
        current = brushOf(result.geometry);
      }
      cutGeom = current.geometry;
    }

    const result = evaluator.evaluate(meshBrush, brushOf(cutGeom), INTERSECTION);
    const posAttr = result.geometry.attributes.position;
    if (!posAttr || posAttr.count < 9) continue; // empty cell, skip
    result.geometry.computeVertexNormals();
    out.set(`${i},${j},${k}`, { geometry: result.geometry, index: [i, j, k] });
  }
  return out;
}

// ---------- display + export ----------
const colorCycle = [0x9184d9, 0xff8a3a, 0x4ade80, 0xf472b6, 0xfacc15, 0x38bdf8, 0xb5abfc, 0xfb7185];

function showPieces() {
  displayGroup.clear();
  const overallBox = new THREE.Box3();
  const centers = [];
  for (const { geometry, index } of pieces.values()) {
    geometry.computeBoundingBox();
    const b = geometry.boundingBox;
    const c = new THREE.Vector3(); b.getCenter(c);
    centers.push({ c, index });
  }
  const gridCenter = new THREE.Vector3();
  centers.forEach(e => gridCenter.add(e.c));
  gridCenter.divideScalar(Math.max(1, centers.length));

  let ci = 0;
  const meshByKey = new Map();
  for (const [key, { geometry }] of pieces) {
    const mat = new THREE.MeshStandardMaterial({ color: colorCycle[ci++ % colorCycle.length], metalness: 0.1, roughness: 0.6 });
    const mesh = new THREE.Mesh(geometry, mat);
    displayGroup.add(mesh);
    meshByKey.set(key, mesh);
    overallBox.expandByObject(mesh);
  }
  frameCameraToBox(overallBox);

  els.explodeRow.style.display = pieces.size > 1 ? 'flex' : 'none';
  els.explodeChk.onchange = () => {
    const factor = els.explodeChk.checked ? 1.6 : 0;
    for (const [key, mesh] of meshByKey) {
      const [i, j, k] = key.split(',').map(Number);
      const c = centers.find(e => e.index[0] === i && e.index[1] === j && e.index[2] === k).c;
      const dir = c.clone().sub(gridCenter);
      mesh.position.copy(dir.multiplyScalar(factor));
    }
  };
  els.explodeChk.checked = false;

  renderPieceList();
}

function exportPieceSTL(geometry) {
  const mesh = new THREE.Mesh(geometry);
  const result = new STLExporter().parse(mesh, { binary: true });
  return result.buffer;
}

function renderPieceList() {
  els.piecesHeader.style.display = 'block';
  els.zipBtn.style.display = pieces.size > 1 ? 'flex' : 'none';
  els.pieceList.innerHTML = '';
  for (const [key, { geometry, index }] of pieces) {
    geometry.computeBoundingBox();
    const s = geometry.boundingBox.getSize(new THREE.Vector3());
    const row = document.createElement('div');
    row.className = 'piece-row';
    row.innerHTML = `<span>${key} &nbsp;(${s.x.toFixed(0)}x${s.y.toFixed(0)}x${s.z.toFixed(0)}mm)</span>`;
    const btn = document.createElement('button');
    btn.className = 'ghost'; btn.textContent = '다운로드';
    btn.onclick = () => downloadArrayBuffer(exportPieceSTL(geometry), `${baseName}_${index.join('-')}.stl`);
    row.appendChild(btn);
    els.pieceList.appendChild(row);
  }
}

function downloadArrayBuffer(buffer, name) {
  const blob = new Blob([buffer], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

els.zipBtn.addEventListener('click', async () => {
  const zip = new JSZip();
  for (const [, { geometry, index }] of pieces) {
    zip.file(`${baseName}_${index.join('-')}.stl`, exportPieceSTL(geometry));
  }
  const blob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${baseName}_parts.zip`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
