<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="STL을 업로드하면 부피/표면적을 자동 계산해 벽 두께와 채움 비율에 따른 PLA 출력물 무게를 알려줍니다.">
<title>PLA 무게 계산기 (STL 업로드)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #161826; --color-surface: #232532; --color-text: #e9e9ed;
    --color-accent: #9184d9; --color-accent-300: #d2cefd; --color-accent-400: #b5abfc;
    --color-accent-700: #5d5294;
    --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);
    --color-neutral-400: #b2b6ca; --color-neutral-500: #9397ab; --color-neutral-600: #75798c;
    --color-neutral-700: #595d6c; --color-neutral-800: #3f424d;
    --font-heading: 'Gowun Batang', 'Hiragino Mincho ProN', 'Songti SC', 'Inter', serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --radius-sm: 4px; --radius-md: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 22.4px 22.4px 33.6px; }
  .back { display: inline-flex; align-items: center; gap: 5.6px; margin-bottom: 16.8px; font-size: 12px; color: var(--color-neutral-500); text-decoration: none; }
  .back:hover { color: var(--color-accent-300); }
  .head { display: flex; align-items: flex-start; gap: 11.2px; margin-bottom: 16.8px; }
  .head i { font-size: 24px; color: var(--color-accent-400); margin-top: 2px; }
  .head h1 { flex: 1; margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: 20px; letter-spacing: -0.005em; }
  .badge { display: flex; align-items: center; gap: 5.6px; padding: 4px 10px; border: 1px solid var(--color-neutral-800); border-radius: 999px; background: var(--color-surface); }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  .badge span { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-500); }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16.8px; align-items: start; }
  .viewer-frame { position: relative; min-height: 460px; border: 1px solid var(--color-neutral-800); border-radius: var(--radius-md); background: radial-gradient(120% 90% at 50% 0%, #1c1f31 0%, #14162200 70%), var(--color-bg); overflow: hidden; }
  .viewer-frame .vgrid { position: absolute; inset: 0; background-image: linear-gradient(color-mix(in srgb, var(--color-text) 5%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--color-text) 5%, transparent) 1px, transparent 1px); background-size: 40px 40px; mask-image: radial-gradient(70% 70% at 50% 45%, #000 0%, transparent 100%); }
  .viewer-frame .vplaceholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8.4px; color: var(--color-neutral-600); }
  .viewer-frame .vplaceholder i { font-size: 32px; }
  .viewer-frame .vplaceholder span { font-size: 12px; }
  .orbit-hint { position: absolute; left: 11.2px; bottom: 11.2px; display: flex; align-items: center; gap: 5.6px; padding: 4px 9px; background: color-mix(in srgb, var(--color-surface) 85%, transparent); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-sm); font-size: 11px; color: var(--color-neutral-500); }
  .viewer-frame canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }

  .panel { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; align-items: start; gap: 16.8px 22.4px; padding: 16.8px; background: var(--color-surface); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-md); overflow-y: auto; max-height: 700px; }
  .section { display: flex; flex-direction: column; gap: 8.4px; }
  .section h2 { margin: 0; padding-bottom: 5.6px; border-bottom: 1px solid var(--color-divider); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-300); font-weight: 500; }

  .upload { display: flex; align-items: center; gap: 11.2px; padding: 14px; border: 1px dashed var(--color-neutral-700); border-radius: var(--radius-md); background: color-mix(in srgb, var(--color-bg) 60%, transparent); cursor: pointer; }
  .upload:hover { border-color: var(--color-accent-700); }
  .upload i { font-size: 18px; color: var(--color-accent-400); flex-shrink: 0; }
  .upload .t { font-size: 13px; }
  .upload .n { font-size: 11px; color: var(--color-neutral-600); margin-top: 2px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

  .numrow { display: flex; align-items: center; gap: 11.2px; }
  .numrow label { flex: 1; font-size: 12px; color: var(--color-neutral-400); }
  .numrow .field { display: flex; align-items: center; gap: 5.6px; }
  .numrow input[type=number] { width: 76px; padding: 5px 8px; text-align: right; background: var(--color-bg); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-sm); color: var(--color-text); font-family: var(--font-body); font-size: 13px; outline: none; }
  .numrow input[type=number]:focus { border-color: var(--color-accent); }
  .numrow .unit { width: 46px; font-size: 11px; color: var(--color-neutral-600); }

  .hint { margin: 0; font-size: 11px; line-height: 1.5; color: var(--color-neutral-600); }

  #result { font-size: 12px; color: var(--color-neutral-400); line-height: 1.7; white-space: pre-wrap; }
  #result .big { font-size: 20px; color: var(--color-accent-300); font-weight: bold; }
  .file-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--color-divider); }
  .file-row span { color: var(--color-neutral-500); }
  .total-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--color-divider); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../"><i class="ph ph-arrow-left"></i><span>전체 도구</span></a>

  <div class="head">
    <i class="ph ph-scales"></i>
    <h1>PLA 무게 계산기</h1>
    <div class="badge"><span class="dot"></span><span>완료</span></div>
  </div>

  <div class="grid">
    <div class="viewer-frame">
      <div class="vgrid"></div>
      <div class="vplaceholder" id="viewerPlaceholder"><i class="ph ph-cube"></i><span>3D 미리보기 영역</span></div>
      <div id="viewer" style="position:absolute; inset:0;"></div>
      <div class="orbit-hint"><i class="ph ph-arrows-clockwise"></i><span>드래그로 회전</span></div>
    </div>

    <div class="panel">
      <div class="section">
        <label class="upload" for="fileInput">
          <i class="ph ph-upload-simple"></i>
          <div>
            <div class="t">STL 파일 선택</div>
            <div class="n" id="origInfo">여러 개 가능 · 부피/표면적을 자동 계산</div>
          </div>
        </label>
        <input type="file" id="fileInput" accept=".stl" multiple>
      </div>

      <div class="section">
        <h2>출력 설정</h2>
        <div class="numrow"><label>벽(쉘) 두께</label><div class="field"><input type="number" id="wallThickness" value="2" min="0" step="0.1"><span class="unit">mm</span></div></div>
        <div class="numrow"><label>내부 채움</label><div class="field"><input type="number" id="infill" value="20" min="0" max="100" step="1"><span class="unit">%</span></div></div>
        <div class="numrow"><label>PLA 밀도</label><div class="field"><input type="number" id="density" value="1.24" min="0" step="0.01"><span class="unit">g/cm³</span></div></div>
        <p class="hint">무게 = 쉘 부피(표면적×두께) + 내부 부피×채움비율, 전부 밀도를 곱해 계산합니다.</p>
      </div>

      <div class="section">
        <div id="result"></div>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.179.0/build/three.module.js",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.179.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { STLLoader } from 'three/examples/jsm/loaders/STLLoader.js';

// ---------- viewer setup ----------
const viewerEl = document.getElementById('viewer');
const viewerPlaceholder = document.getElementById('viewerPlaceholder');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161826);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1e6);
const renderer = new THREE.WebGLRenderer({ antialias: true });
viewerEl.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(1, 1, 1);
scene.add(dirLight);
const orbit = new OrbitControls(camera, renderer.domElement);

function resize() {
  const w = viewerEl.clientWidth, h = viewerEl.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
(function animate() {
  requestAnimationFrame(animate);
  orbit.update();
  renderer.render(scene, camera);
})();

function frameCameraToBox(box) {
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const dist = maxDim * 2.2;
  camera.position.set(center.x + dist, center.y + dist, center.z + dist);
  orbit.target.copy(center);
  camera.near = maxDim / 100;
  camera.far = maxDim * 100;
  camera.updateProjectionMatrix();
  orbit.update();
}

// ---------- geometry -> volume/surface area (mesh divergence theorem) ----------
function computeVolumeArea(geometry) {
  const pos = geometry.attributes.position;
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  let volume = 0, area = 0;
  for (let i = 0; i < pos.count; i += 3) {
    a.fromBufferAttribute(pos, i);
    b.fromBufferAttribute(pos, i + 1);
    c.fromBufferAttribute(pos, i + 2);
    volume += a.dot(b.clone().cross(c)) / 6;
    area += b.clone().sub(a).cross(c.clone().sub(a)).length() / 2;
  }
  return { volumeMm3: Math.abs(volume), areaMm2: area };
}

function calcWeight(volumeCm3, areaCm2, wallThicknessMm, infillPercent, densityGCm3) {
  const wallCm = wallThicknessMm / 10;
  const shellCm3 = Math.min(areaCm2 * wallCm, volumeCm3);
  const internalCm3 = Math.max(volumeCm3 - shellCm3, 0);
  const fillCm3 = internalCm3 * (infillPercent / 100);
  return (shellCm3 + fillCm3) * densityGCm3;
}

// ---------- state ----------
let modelList = []; // [{ name, size, volumeCm3, areaCm2 }]
const colorCycle = [0x9184d9, 0xff8a3a, 0x4ade80, 0xf472b6, 0xfacc15, 0x38bdf8, 0xb5abfc, 0xfb7185];

const els = {
  fileInput: document.getElementById('fileInput'),
  origInfo: document.getElementById('origInfo'),
  wallThickness: document.getElementById('wallThickness'),
  infill: document.getElementById('infill'),
  density: document.getElementById('density'),
  result: document.getElementById('result'),
};

els.fileInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  if (files.length) loadSTLFiles(files);
});

async function loadSTLFiles(files) {
  els.origInfo.textContent = '불러오는 중...';
  viewerPlaceholder.style.display = 'none';
  modelList = [];
  scene.children = scene.children.filter(o => !o.isMesh);
  const overallBox = new THREE.Box3();
  let offsetX = 0;

  for (const [i, file] of files.entries()) {
    const buf = await file.arrayBuffer();
    const geometry = new STLLoader().parse(buf);
    geometry.computeBoundingBox();
    const bb = geometry.boundingBox;
    const size = [bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z];
    const { volumeMm3, areaMm2 } = computeVolumeArea(geometry);
    modelList.push({ name: file.name, size, volumeCm3: volumeMm3 / 1000, areaCm2: areaMm2 / 100 });

    geometry.translate(-bb.min.x, -bb.min.y, -bb.min.z); // sit on origin corner
    const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: colorCycle[i % colorCycle.length], metalness: 0.1, roughness: 0.6 }));
    mesh.position.x = offsetX;
    scene.add(mesh);
    overallBox.expandByObject(mesh);
    offsetX += size[0] + Math.max(size[0], size[1], size[2]) * 0.2; // gap so pieces don't overlap
  }

  els.origInfo.textContent = `${modelList.length}개 파일 로드됨`;
  frameCameraToBox(overallBox);
  updateResult();
}

function updateResult() {
  if (!modelList.length) { els.result.textContent = ''; return; }
  const wallThickness = parseFloat(els.wallThickness.value) || 0;
  const infill = parseFloat(els.infill.value) || 0;
  const density = parseFloat(els.density.value) || 0;

  let totalWeight = 0;
  const rows = modelList.map(m => {
    const weight = calcWeight(m.volumeCm3, m.areaCm2, wallThickness, infill, density);
    totalWeight += weight;
    return `<div class="file-row"><span>${m.name} (${m.size[0].toFixed(0)}x${m.size[1].toFixed(0)}x${m.size[2].toFixed(0)}mm)</span><span>${weight.toFixed(2)} g</span></div>`;
  }).join('');

  els.result.innerHTML = rows +
    `<div class="total-row">전체 무게\n<span class="big">${totalWeight.toFixed(2)} g</span>  (${(totalWeight / 1000).toFixed(3)} kg)</div>`;
}

[els.wallThickness, els.infill, els.density].forEach(el => el.addEventListener('input', updateResult));
</script>
</body>
</html>
