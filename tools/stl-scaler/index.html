<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STL 크기 조절 프로그램</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #161826; --color-surface: #232532; --color-text: #e9e9ed;
    --color-accent: #9184d9; --color-accent-300: #d2cefd; --color-accent-900: #2b2741;
    --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);
    --color-neutral-400: #b2b6ca; --color-neutral-500: #9397ab; --color-neutral-600: #75798c;
    --color-neutral-700: #595d6c; --color-neutral-800: #3f424d;
    --radius-sm: 4px; --radius-md: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: 'Inter', system-ui, sans-serif; background: var(--color-bg); color: var(--color-text); }
  .back { position: absolute; top: 14px; left: 16px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-neutral-500); text-decoration: none; padding: 4px 8px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--color-surface) 85%, transparent); }
  .back:hover { color: var(--color-accent-300); }
  #viewer { position: absolute; top: 0; left: 0; right: 320px; bottom: 0; border-right: 1px solid var(--color-neutral-800); }
  .orbit-hint { position: absolute; left: 12px; bottom: 12px; z-index: 2; display: flex; align-items: center; gap: 6px; padding: 4px 9px; background: color-mix(in srgb, var(--color-surface) 85%, transparent); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-sm); font-size: 11px; color: var(--color-neutral-500); }
  #panel { position: absolute; top: 0; right: 0; width: 320px; bottom: 0; background: var(--color-surface); padding: 16px; box-sizing: border-box; overflow-y: auto; }
  h2 { font-size: 16px; margin: 0 0 12px; font-weight: 600; }
  .file-row { display: flex; align-items: center; gap: 11px; padding: 14px; border: 1px dashed var(--color-neutral-700); border-radius: var(--radius-md); background: color-mix(in srgb, var(--color-bg) 60%, transparent); cursor: pointer; margin-bottom: 16px; }
  .file-row:hover { border-color: var(--color-accent); }
  .file-row .flabel { font-size: 13px; }
  .file-row .fnote { font-size: 11px; color: var(--color-neutral-600); margin-top: 2px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .row label { flex: 1; font-size: 12px; color: var(--color-neutral-400); }
  .row input[type=number] { width: 90px; padding: 5px 8px; text-align: right; background: var(--color-bg); color: var(--color-text); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-sm); font: inherit; font-size: 13px; }
  .row input[type=number]:focus { outline: none; border-color: var(--color-accent); }
  .row .unit { width: 26px; font-size: 11px; color: var(--color-neutral-600); }
  .lockrow { display: flex; align-items: flex-start; gap: 9px; padding: 9px 11px; border: 1px solid var(--color-neutral-800); border-radius: var(--radius-sm); cursor: pointer; margin: 14px 0; font-size: 12.5px; }
  .lockrow:has(input:checked) { border-color: var(--color-accent); background: color-mix(in srgb, var(--color-accent-900) 55%, transparent); }
  button { width: 100%; padding: 9px; margin-top: 8px; border-radius: var(--radius-md); font-size: 13px; cursor: pointer; font-family: inherit; background: transparent; color: var(--color-accent); border: 1px solid var(--color-accent); }
  button:hover:not(:disabled) { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
  button:disabled { color: var(--color-neutral-600); border-color: var(--color-neutral-800); cursor: not-allowed; }
  button.secondary { color: var(--color-neutral-400); border-color: var(--color-neutral-800); }
  button.secondary:hover:not(:disabled) { border-color: var(--color-neutral-600); color: var(--color-text); background: transparent; }
  #info { font-size: 12px; color: var(--color-neutral-500); margin-top: 16px; line-height: 1.6; white-space: pre-wrap; }
  hr { border: none; border-top: 1px solid var(--color-divider); margin: 16px 0; }
</style>
</head>
<body>
<a class="back" href="../../index.html">&larr; 전체 도구</a>
<div id="viewer"></div>
<div class="orbit-hint">드래그로 회전</div>
<div id="panel">
  <h2>STL 크기 조절</h2>

  <label class="file-row" for="fileInput">
    <svg width="18" height="18" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M224 152v56a16 16 0 0 1-16 16H48a16 16 0 0 1-16-16v-56" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M168 92l-40-40-40 40" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M128 52v112" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div>
      <div class="flabel">STL 파일 선택</div>
      <div class="fnote">선택하면 원본 치수(mm)가 표시됩니다</div>
    </div>
  </label>
  <input type="file" id="fileInput" accept=".stl">

  <div class="row"><label>가로 (X)</label><input type="number" id="dimX" step="any" disabled><span class="unit">mm</span></div>
  <div class="row"><label>세로 (Y)</label><input type="number" id="dimY" step="any" disabled><span class="unit">mm</span></div>
  <div class="row"><label>높이 (Z)</label><input type="number" id="dimZ" step="any" disabled><span class="unit">mm</span></div>

  <label class="lockrow">
    <input type="checkbox" id="lockRatio" checked>
    <span>비율 유지 (가로/세로/높이 동시 조절)</span>
  </label>

  <button id="exportBtn" disabled>변경된 STL 저장</button>
  <button id="resetBtn" class="secondary" disabled>원본 크기로 되돌리기</button>

  <div id="info">STL 파일을 선택하면 원본 치수(mm)가 표시됩니다.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
<script>
const viewerEl = document.getElementById('viewer');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161826);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
viewerEl.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(1, 1, 1);
scene.add(dirLight);

const controls = new THREE.OrbitControls(camera, renderer.domElement);

function resize() {
  const w = viewerEl.clientWidth, h = viewerEl.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();

let mesh = null;
let originalSize = null; // THREE.Vector3, bounding box size at scale (1,1,1)

const dimX = document.getElementById('dimX');
const dimY = document.getElementById('dimY');
const dimZ = document.getElementById('dimZ');
const lockRatio = document.getElementById('lockRatio');
const exportBtn = document.getElementById('exportBtn');
const resetBtn = document.getElementById('resetBtn');
const info = document.getElementById('info');

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => loadSTL(ev.target.result, file.name);
  reader.readAsArrayBuffer(file);
});

function loadSTL(arrayBuffer, name) {
  if (mesh) scene.remove(mesh);

  const geometry = new THREE.STLLoader().parse(arrayBuffer);
  geometry.center();
  geometry.computeBoundingBox();

  const material = new THREE.MeshStandardMaterial({ color: 0x9184d9, metalness: 0.1, roughness: 0.6 });
  mesh = new THREE.Mesh(geometry, material);
  mesh.scale.set(1, 1, 1);
  scene.add(mesh);

  const bb = geometry.boundingBox;
  originalSize = new THREE.Vector3(bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z);

  dimX.value = originalSize.x.toFixed(3);
  dimY.value = originalSize.y.toFixed(3);
  dimZ.value = originalSize.z.toFixed(3);
  [dimX, dimY, dimZ].forEach(el => el.disabled = false);
  exportBtn.disabled = false;
  resetBtn.disabled = false;

  frameCamera();
  info.textContent = `파일: ${name}\n원본 크기 (mm): ${originalSize.x.toFixed(2)} x ${originalSize.y.toFixed(2)} x ${originalSize.z.toFixed(2)}`;
}

function frameCamera() {
  const box = new THREE.Box3().setFromObject(mesh);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const dist = maxDim * 2.2;
  camera.position.set(center.x + dist, center.y + dist, center.z + dist);
  controls.target.copy(center);
  camera.near = maxDim / 100;
  camera.far = maxDim * 100;
  camera.updateProjectionMatrix();
  controls.update();
}

function applyDim(axis, value) {
  if (!mesh || !originalSize) return;
  const target = parseFloat(value);
  if (!isFinite(target) || target <= 0) return;

  if (lockRatio.checked) {
    setUniform(target / originalSize[axis]);
  } else {
    mesh.scale[axis] = target / originalSize[axis];
    syncFieldsFromScale();
  }
}

function setUniform(factor) {
  mesh.scale.set(factor, factor, factor);
  syncFieldsFromScale();
}

function syncFieldsFromScale() {
  dimX.value = (originalSize.x * mesh.scale.x).toFixed(3);
  dimY.value = (originalSize.y * mesh.scale.y).toFixed(3);
  dimZ.value = (originalSize.z * mesh.scale.z).toFixed(3);
  frameCamera();
}

dimX.addEventListener('input', () => applyDim('x', dimX.value));
dimY.addEventListener('input', () => applyDim('y', dimY.value));
dimZ.addEventListener('input', () => applyDim('z', dimZ.value));

resetBtn.addEventListener('click', () => {
  if (!mesh || !originalSize) return;
  mesh.scale.set(1, 1, 1);
  syncFieldsFromScale();
});

exportBtn.addEventListener('click', () => {
  if (!mesh) return;
  const exporter = new THREE.STLExporter();
  const stlString = exporter.parse(mesh, { binary: false });
  const blob = new Blob([stlString], { type: 'model/stl' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'scaled_model.stl';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
