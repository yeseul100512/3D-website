<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STL 크기 조절 프로그램</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #161826; --color-surface: #232532; --color-text: #e9e9ed;
    --color-accent: #9184d9; --color-accent-300: #d2cefd; --color-accent-400: #b5abfc;
    --color-accent-700: #5d5294; --color-accent-900: #2b2741;
    --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);
    --color-neutral-400: #b2b6ca; --color-neutral-500: #9397ab; --color-neutral-600: #75798c;
    --color-neutral-700: #595d6c; --color-neutral-800: #3f424d;
    --font-heading: 'Gowun Batang', 'Hiragino Mincho ProN', 'Songti SC', 'Inter', serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --radius-sm: 4px; --radius-md: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 22.4px 22.4px 33.6px; }
  .back { display: inline-flex; align-items: center; gap: 5.6px; margin-bottom: 16.8px; font-size: 12px; color: var(--color-neutral-500); text-decoration: none; }
  .back:hover { color: var(--color-accent-300); }
  .head { display: flex; align-items: flex-start; gap: 11.2px; margin-bottom: 16.8px; }
  .head i { font-size: 24px; color: var(--color-accent-400); margin-top: 2px; }
  .head h1 { flex: 1; margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: 20px; letter-spacing: -0.005em; }
  .badge { display: flex; align-items: center; gap: 5.6px; padding: 4px 10px; border: 1px solid var(--color-neutral-800); border-radius: 999px; background: var(--color-surface); }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  .badge span { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-500); }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16.8px; align-items: start; }
  .viewer-frame { position: relative; min-height: 460px; border: 1px solid var(--color-neutral-800); border-radius: var(--radius-md); background: radial-gradient(120% 90% at 50% 0%, #1c1f31 0%, #14162200 70%), var(--color-bg); overflow: hidden; }
  .viewer-frame .vgrid { position: absolute; inset: 0; background-image: linear-gradient(color-mix(in srgb, var(--color-text) 5%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--color-text) 5%, transparent) 1px, transparent 1px); background-size: 40px 40px; mask-image: radial-gradient(70% 70% at 50% 45%, #000 0%, transparent 100%); }
  .viewer-frame .vplaceholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8.4px; color: var(--color-neutral-600); }
  .viewer-frame .vplaceholder i { font-size: 32px; }
  .viewer-frame .vplaceholder span { font-size: 12px; }
  .orbit-hint { position: absolute; left: 11.2px; bottom: 11.2px; display: flex; align-items: center; gap: 5.6px; padding: 4px 9px; background: color-mix(in srgb, var(--color-surface) 85%, transparent); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-sm); font-size: 11px; color: var(--color-neutral-500); }
  .viewer-frame canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }

  .panel { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; align-items: start; gap: 16.8px 22.4px; padding: 16.8px; background: var(--color-surface); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-md); }
  .section { display: flex; flex-direction: column; gap: 8.4px; }
  .section h2 { margin: 0; padding-bottom: 5.6px; border-bottom: 1px solid var(--color-divider); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-300); font-weight: 500; }

  .upload { display: flex; align-items: center; gap: 11.2px; padding: 14px; border: 1px dashed var(--color-neutral-700); border-radius: var(--radius-md); background: color-mix(in srgb, var(--color-bg) 60%, transparent); cursor: pointer; }
  .upload:hover { border-color: var(--color-accent-700); }
  .upload i { font-size: 18px; color: var(--color-accent-400); flex-shrink: 0; }
  .upload .t { font-size: 13px; }
  .upload .n { font-size: 11px; color: var(--color-neutral-600); margin-top: 2px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

  .numrow { display: flex; align-items: center; gap: 11.2px; }
  .numrow label { flex: 1; font-size: 12px; color: var(--color-neutral-400); }
  .numrow .field { display: flex; align-items: center; gap: 5.6px; }
  .numrow input[type=number] { width: 76px; padding: 5px 8px; text-align: right; background: var(--color-bg); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-sm); color: var(--color-text); font-family: var(--font-body); font-size: 13px; outline: none; }
  .numrow input[type=number]:focus { border-color: var(--color-accent); }
  .numrow input[type=number]:disabled { color: var(--color-neutral-600); }
  .numrow .unit { width: 42px; font-size: 11px; color: var(--color-neutral-600); }

  .choice { display: flex; align-items: flex-start; gap: 8.4px; padding: 9px 11.2px; border: 1px solid var(--color-neutral-800); border-radius: var(--radius-sm); cursor: pointer; }
  .choice:has(input:checked) { border-color: var(--color-accent-700); background: color-mix(in srgb, var(--color-accent-900) 55%, transparent); }
  .choice input { position: absolute; opacity: 0; width: 0; height: 0; }
  .choice i { font-size: 15px; color: var(--color-accent-400); margin-top: 1px; }
  .choice .t { font-size: 12.5px; }
  .choice .n { font-size: 11px; color: var(--color-neutral-600); line-height: 1.4; }

  .hint { margin: 0; font-size: 11px; line-height: 1.5; color: var(--color-neutral-600); white-space: pre-wrap; }

  button.primary, button.ghost { width: 100%; display: flex; align-items: center; justify-content: center; gap: 5.6px; padding: 9px; border-radius: var(--radius-md); font-size: 13px; cursor: pointer; font-family: var(--font-body); }
  button.primary { background: transparent; color: var(--color-accent); border: 1px solid var(--color-accent); }
  button.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--color-accent) 14%, transparent); }
  button.primary:disabled { color: var(--color-neutral-600); border-color: var(--color-neutral-800); cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--color-neutral-400); border: 1px solid var(--color-neutral-800); }
  button.ghost:hover:not(:disabled) { border-color: var(--color-neutral-600); color: var(--color-text); }
  button.ghost:disabled { color: var(--color-neutral-700); cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../index.html"><i class="ph ph-arrow-left"></i><span>전체 도구</span></a>

  <div class="head">
    <i class="ph ph-arrows-out-cardinal"></i>
    <h1>STL 크기 조절</h1>
    <div class="badge"><span class="dot"></span><span>완료</span></div>
  </div>

  <div class="grid">
    <div class="viewer-frame">
      <div class="vgrid"></div>
      <div class="vplaceholder" id="viewerPlaceholder"><i class="ph ph-cube"></i><span>3D 미리보기 영역</span></div>
      <div id="viewer" style="position:absolute; inset:0;"></div>
      <div class="orbit-hint"><i class="ph ph-arrows-clockwise"></i><span>드래그로 회전</span></div>
    </div>

    <div class="panel">
      <div class="section">
        <label class="upload" for="fileInput">
          <i class="ph ph-upload-simple"></i>
          <div>
            <div class="t">STL 파일 선택</div>
            <div class="n">선택하면 원본 치수(mm)가 표시됩니다</div>
          </div>
        </label>
        <input type="file" id="fileInput" accept=".stl">
      </div>

      <div class="section">
        <h2>치수</h2>
        <div class="numrow"><label>가로 (X)</label><div class="field"><input type="number" id="dimX" step="any" disabled><span class="unit">mm</span></div></div>
        <div class="numrow"><label>세로 (Y)</label><div class="field"><input type="number" id="dimY" step="any" disabled><span class="unit">mm</span></div></div>
        <div class="numrow"><label>높이 (Z)</label><div class="field"><input type="number" id="dimZ" step="any" disabled><span class="unit">mm</span></div></div>
        <label class="choice">
          <input type="checkbox" id="lockRatio" checked>
          <i class="ph ph-lock-simple"></i>
          <div><div class="t">비율 유지</div><div class="n">가로/세로/높이를 동시에 조절</div></div>
        </label>
      </div>

      <div class="section">
        <button class="primary" id="exportBtn" disabled><i class="ph ph-floppy-disk"></i><span>변경된 STL 저장</span></button>
        <button class="ghost" id="resetBtn" disabled><i class="ph ph-arrow-counter-clockwise"></i><span>원본 크기로 되돌리기</span></button>
        <p class="hint" id="info">STL 파일을 선택하면 원본 치수(mm)가 표시됩니다.</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
<script>
const viewerEl = document.getElementById('viewer');
const viewerPlaceholder = document.getElementById('viewerPlaceholder');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161826);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
viewerEl.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(1, 1, 1);
scene.add(dirLight);

const controls = new THREE.OrbitControls(camera, renderer.domElement);

function resize() {
  const w = viewerEl.clientWidth, h = viewerEl.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();

let mesh = null;
let originalSize = null; // THREE.Vector3, bounding box size at scale (1,1,1)

const dimX = document.getElementById('dimX');
const dimY = document.getElementById('dimY');
const dimZ = document.getElementById('dimZ');
const lockRatio = document.getElementById('lockRatio');
const exportBtn = document.getElementById('exportBtn');
const resetBtn = document.getElementById('resetBtn');
const info = document.getElementById('info');

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => loadSTL(ev.target.result, file.name);
  reader.readAsArrayBuffer(file);
});

function loadSTL(arrayBuffer, name) {
  if (mesh) scene.remove(mesh);
  viewerPlaceholder.style.display = 'none';

  const geometry = new THREE.STLLoader().parse(arrayBuffer);
  geometry.center();
  geometry.computeBoundingBox();

  const material = new THREE.MeshStandardMaterial({ color: 0x9184d9, metalness: 0.1, roughness: 0.6 });
  mesh = new THREE.Mesh(geometry, material);
  mesh.scale.set(1, 1, 1);
  scene.add(mesh);

  const bb = geometry.boundingBox;
  originalSize = new THREE.Vector3(bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z);

  dimX.value = originalSize.x.toFixed(3);
  dimY.value = originalSize.y.toFixed(3);
  dimZ.value = originalSize.z.toFixed(3);
  [dimX, dimY, dimZ].forEach(el => el.disabled = false);
  exportBtn.disabled = false;
  resetBtn.disabled = false;

  frameCamera();
  info.textContent = `파일: ${name}\n원본 크기 (mm): ${originalSize.x.toFixed(2)} x ${originalSize.y.toFixed(2)} x ${originalSize.z.toFixed(2)}`;
}

function frameCamera() {
  const box = new THREE.Box3().setFromObject(mesh);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const dist = maxDim * 2.2;
  camera.position.set(center.x + dist, center.y + dist, center.z + dist);
  controls.target.copy(center);
  camera.near = maxDim / 100;
  camera.far = maxDim * 100;
  camera.updateProjectionMatrix();
  controls.update();
}

function applyDim(axis, value) {
  if (!mesh || !originalSize) return;
  const target = parseFloat(value);
  if (!isFinite(target) || target <= 0) return;

  if (lockRatio.checked) {
    setUniform(target / originalSize[axis]);
  } else {
    mesh.scale[axis] = target / originalSize[axis];
    syncFieldsFromScale();
  }
}

function setUniform(factor) {
  mesh.scale.set(factor, factor, factor);
  syncFieldsFromScale();
}

function syncFieldsFromScale() {
  dimX.value = (originalSize.x * mesh.scale.x).toFixed(3);
  dimY.value = (originalSize.y * mesh.scale.y).toFixed(3);
  dimZ.value = (originalSize.z * mesh.scale.z).toFixed(3);
  frameCamera();
}

dimX.addEventListener('input', () => applyDim('x', dimX.value));
dimY.addEventListener('input', () => applyDim('y', dimY.value));
dimZ.addEventListener('input', () => applyDim('z', dimZ.value));

resetBtn.addEventListener('click', () => {
  if (!mesh || !originalSize) return;
  mesh.scale.set(1, 1, 1);
  syncFieldsFromScale();
});

exportBtn.addEventListener('click', () => {
  if (!mesh) return;
  const exporter = new THREE.STLExporter();
  const stlString = exporter.parse(mesh, { binary: false });
  const blob = new Blob([stlString], { type: 'model/stl' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'scaled_model.stl';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
