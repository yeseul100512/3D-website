<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STL 크기 확인 프로그램</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #161826; --color-surface: #232532; --color-text: #e9e9ed;
    --color-accent: #9184d9; --color-accent-300: #d2cefd;
    --color-neutral-500: #9397ab; --color-neutral-600: #75798c; --color-neutral-700: #595d6c; --color-neutral-800: #3f424d;
    --radius-sm: 4px; --radius-md: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: 'Inter', system-ui, sans-serif; background: var(--color-bg); color: var(--color-text); }
  .back { display: inline-flex; align-items: center; gap: 6px; margin: 16px 0 0 16px; font-size: 12px; color: var(--color-neutral-500); text-decoration: none; }
  .back:hover { color: var(--color-accent-300); }
  .panel { max-width: 640px; margin: 0 auto; padding: 16px 20px 32px; }
  h2 { font-size: 18px; margin: 16px 0 4px; font-weight: 600; }
  .hint { font-size: 12px; color: var(--color-neutral-600); margin: 0 0 20px; line-height: 1.5; }
  .file-row { display: flex; align-items: center; gap: 11px; padding: 14px; border: 1px dashed var(--color-neutral-700); border-radius: var(--radius-md); background: color-mix(in srgb, var(--color-bg) 60%, transparent); cursor: pointer; margin-bottom: 20px; }
  .file-row:hover { border-color: var(--color-accent); }
  .file-row .flabel { font-size: 13px; }
  .file-row .fnote { font-size: 11px; color: var(--color-neutral-600); margin-top: 2px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .result-list { display: flex; flex-direction: column; gap: 10px; }
  .result-card { background: var(--color-surface); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-md); padding: 14px 16px; font-size: 13px; line-height: 1.7; }
  .result-card .fname { color: var(--color-accent-300); font-weight: 600; margin-bottom: 4px; word-break: break-all; }
  .result-card .dim-label { color: var(--color-neutral-600); display: inline-block; width: 70px; }
  .result-card .error { color: #ff8a8a; }
  .empty { font-size: 13px; color: var(--color-neutral-600); }
</style>
</head>
<body>
<a class="back" href="../../index.html">&larr; 전체 도구</a>
<div class="panel">
  <h2>STL 크기(가로/세로/높이) 확인</h2>
  <p class="hint">STL 파일을 선택하세요 (여러 개 선택 가능). ASCII/바이너리 STL 모두 지원하며, mm 단위로 표시합니다.</p>
  <label class="file-row" for="fileInput">
    <svg width="18" height="18" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M224 152v56a16 16 0 0 1-16 16H48a16 16 0 0 1-16-16v-56" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M168 92l-40-40-40 40" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M128 52v112" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div>
      <div class="flabel">STL 파일 선택</div>
      <div class="fnote">여러 개 선택 가능 · ASCII / 바이너리 지원</div>
    </div>
  </label>
  <input type="file" id="fileInput" accept=".stl" multiple>
  <div class="result-list" id="resultList">
    <div class="empty">아직 선택한 파일이 없습니다.</div>
  </div>
</div>

<script>
// ---------- parse_stl 포팅 (stl_size_checker.py의 parse_stl과 1:1 대응) ----------
function parseStl(bytes) {
  const fileSize = bytes.length;
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

  let triangleCount = 0;
  if (fileSize >= 84) triangleCount = view.getUint32(80, true);

  const expectedBinarySize = 84 + 50 * triangleCount;
  if (fileSize === expectedBinarySize && triangleCount > 0) {
    return parseBinaryStl(view, triangleCount);
  }
  return parseAsciiStl(bytes);
}

function parseBinaryStl(view, triangleCount) {
  const minXyz = [Infinity, Infinity, Infinity];
  const maxXyz = [-Infinity, -Infinity, -Infinity];
  let offset = 84;
  for (let t = 0; t < triangleCount; t++) {
    if (offset + 50 > view.byteLength) break;
    let vOffset = offset + 12; // skip normal
    for (let i = 0; i < 3; i++) {
      const x = view.getFloat32(vOffset, true);
      const y = view.getFloat32(vOffset + 4, true);
      const z = view.getFloat32(vOffset + 8, true);
      vOffset += 12;
      const vals = [x, y, z];
      for (let axis = 0; axis < 3; axis++) {
        if (vals[axis] < minXyz[axis]) minXyz[axis] = vals[axis];
        if (vals[axis] > maxXyz[axis]) maxXyz[axis] = vals[axis];
      }
    }
    offset += 50;
  }
  return { minXyz, maxXyz };
}

function parseAsciiStl(bytes) {
  const minXyz = [Infinity, Infinity, Infinity];
  const maxXyz = [-Infinity, -Infinity, -Infinity];
  const text = new TextDecoder("utf-8", { fatal: false }).decode(bytes);
  for (const rawLine of text.split(/\r\n|\r|\n/)) {
    const line = rawLine.trim();
    if (line.startsWith("vertex")) {
      const parts = line.split(/\s+/);
      if (parts.length >= 4) {
        const vals = [parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])];
        for (let axis = 0; axis < 3; axis++) {
          if (vals[axis] < minXyz[axis]) minXyz[axis] = vals[axis];
          if (vals[axis] > maxXyz[axis]) maxXyz[axis] = vals[axis];
        }
      }
    }
  }
  return { minXyz, maxXyz };
}

// ---------- UI ----------
const fileInput = document.getElementById('fileInput');
const resultList = document.getElementById('resultList');

fileInput.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  resultList.innerHTML = '';

  for (const file of files) {
    const card = document.createElement('div');
    card.className = 'result-card';
    try {
      const buf = await file.arrayBuffer();
      const { minXyz, maxXyz } = parseStl(new Uint8Array(buf));
      const width = maxXyz[0] - minXyz[0];
      const depth = maxXyz[1] - minXyz[1];
      const height = maxXyz[2] - minXyz[2];
      card.innerHTML =
        `<div class="fname">${file.name}</div>` +
        `<div><span class="dim-label">가로 (X)</span>${width.toFixed(2)} mm</div>` +
        `<div><span class="dim-label">세로 (Y)</span>${depth.toFixed(2)} mm</div>` +
        `<div><span class="dim-label">높이 (Z)</span>${height.toFixed(2)} mm</div>`;
    } catch (err) {
      card.innerHTML = `<div class="fname">${file.name}</div><div class="error">오류: ${err.message}</div>`;
    }
    resultList.appendChild(card);
  }
});
</script>
</body>
</html>
