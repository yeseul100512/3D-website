<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="STL 파일(여러 개 가능)의 가로/세로/높이 바운딩 박스 크기를 mm 단위로 확인합니다. ASCII/바이너리 STL 모두 지원.">
<title>STL 크기 확인 프로그램</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #161826; --color-surface: #232532; --color-text: #e9e9ed;
    --color-accent: #9184d9; --color-accent-300: #d2cefd; --color-accent-400: #b5abfc;
    --color-accent-700: #5d5294;
    --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);
    --color-neutral-500: #9397ab; --color-neutral-600: #75798c; --color-neutral-700: #595d6c; --color-neutral-800: #3f424d;
    --font-heading: 'Gowun Batang', 'Hiragino Mincho ProN', 'Songti SC', 'Inter', serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --radius-sm: 4px; --radius-md: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 22.4px 22.4px 33.6px; }
  .back { display: inline-flex; align-items: center; gap: 5.6px; margin-bottom: 16.8px; font-size: 12px; color: var(--color-neutral-500); text-decoration: none; }
  .back:hover { color: var(--color-accent-300); }
  .head { display: flex; align-items: flex-start; gap: 11.2px; margin-bottom: 16.8px; }
  .head i { font-size: 24px; color: var(--color-accent-400); margin-top: 2px; }
  .head h1 { flex: 1; margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: 20px; letter-spacing: -0.005em; }
  .badge { display: flex; align-items: center; gap: 5.6px; padding: 4px 10px; border: 1px solid var(--color-neutral-800); border-radius: 999px; background: var(--color-surface); }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  .badge span { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-500); }

  .panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-content: start; align-items: start; gap: 16.8px 22.4px; padding: 16.8px; background: var(--color-surface); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-md); margin-bottom: 16.8px; }
  .section { display: flex; flex-direction: column; gap: 8.4px; }

  .upload { display: flex; align-items: center; gap: 11.2px; padding: 14px; border: 1px dashed var(--color-neutral-700); border-radius: var(--radius-md); background: color-mix(in srgb, var(--color-bg) 60%, transparent); cursor: pointer; }
  .upload:hover { border-color: var(--color-accent-700); }
  .upload i { font-size: 18px; color: var(--color-accent-400); flex-shrink: 0; }
  .upload .t { font-size: 13px; }
  .upload .n { font-size: 11px; color: var(--color-neutral-600); margin-top: 2px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

  .hint { margin: 0; font-size: 11px; line-height: 1.5; color: var(--color-neutral-600); }
  .empty { padding: 14px; text-align: center; font-size: 12px; color: var(--color-neutral-700); border: 1px solid var(--color-divider); border-radius: var(--radius-sm); }

  .result-list { display: flex; flex-direction: column; gap: 10px; }
  .result-card { background: var(--color-surface); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-md); padding: 14px 16px; font-size: 13px; line-height: 1.7; }
  .result-card .fname { color: var(--color-accent-300); font-weight: 600; margin-bottom: 4px; word-break: break-all; }
  .result-card .dim-label { color: var(--color-neutral-600); display: inline-block; width: 70px; }
  .result-card .error { color: #ff8a8a; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../"><i class="ph ph-arrow-left"></i><span>전체 도구</span></a>

  <div class="head">
    <i class="ph ph-ruler"></i>
    <h1>STL 크기 확인</h1>
    <div class="badge"><span class="dot"></span><span>완료</span></div>
  </div>

  <div class="panel">
    <div class="section">
      <label class="upload" for="fileInput">
        <i class="ph ph-upload-simple"></i>
        <div>
          <div class="t">STL 파일 선택</div>
          <div class="n">여러 개 선택 가능 · ASCII / 바이너리 지원</div>
        </div>
      </label>
      <input type="file" id="fileInput" accept=".stl" multiple>
      <div class="empty" id="emptyState">아직 선택한 파일이 없습니다.</div>
      <p class="hint">가로(X) · 세로(Y) · 높이(Z)를 mm 단위로 파일별로 표시합니다.</p>
    </div>
  </div>

  <div class="result-list" id="resultList"></div>
</div>

<script>
// ---------- parse_stl 포팅 (stl_size_checker.py의 parse_stl과 1:1 대응) ----------
function parseStl(bytes) {
  const fileSize = bytes.length;
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

  let triangleCount = 0;
  if (fileSize >= 84) triangleCount = view.getUint32(80, true);

  const expectedBinarySize = 84 + 50 * triangleCount;
  if (fileSize === expectedBinarySize && triangleCount > 0) {
    return parseBinaryStl(view, triangleCount);
  }
  return parseAsciiStl(bytes);
}

function parseBinaryStl(view, triangleCount) {
  const minXyz = [Infinity, Infinity, Infinity];
  const maxXyz = [-Infinity, -Infinity, -Infinity];
  let offset = 84;
  for (let t = 0; t < triangleCount; t++) {
    if (offset + 50 > view.byteLength) break;
    let vOffset = offset + 12; // skip normal
    for (let i = 0; i < 3; i++) {
      const x = view.getFloat32(vOffset, true);
      const y = view.getFloat32(vOffset + 4, true);
      const z = view.getFloat32(vOffset + 8, true);
      vOffset += 12;
      const vals = [x, y, z];
      for (let axis = 0; axis < 3; axis++) {
        if (vals[axis] < minXyz[axis]) minXyz[axis] = vals[axis];
        if (vals[axis] > maxXyz[axis]) maxXyz[axis] = vals[axis];
      }
    }
    offset += 50;
  }
  return { minXyz, maxXyz };
}

function parseAsciiStl(bytes) {
  const minXyz = [Infinity, Infinity, Infinity];
  const maxXyz = [-Infinity, -Infinity, -Infinity];
  const text = new TextDecoder("utf-8", { fatal: false }).decode(bytes);
  for (const rawLine of text.split(/\r\n|\r|\n/)) {
    const line = rawLine.trim();
    if (line.startsWith("vertex")) {
      const parts = line.split(/\s+/);
      if (parts.length >= 4) {
        const vals = [parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])];
        for (let axis = 0; axis < 3; axis++) {
          if (vals[axis] < minXyz[axis]) minXyz[axis] = vals[axis];
          if (vals[axis] > maxXyz[axis]) maxXyz[axis] = vals[axis];
        }
      }
    }
  }
  return { minXyz, maxXyz };
}

// ---------- UI ----------
const fileInput = document.getElementById('fileInput');
const resultList = document.getElementById('resultList');
const emptyState = document.getElementById('emptyState');

fileInput.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  emptyState.style.display = 'none';
  resultList.innerHTML = '';

  for (const file of files) {
    const card = document.createElement('div');
    card.className = 'result-card';
    try {
      const buf = await file.arrayBuffer();
      const { minXyz, maxXyz } = parseStl(new Uint8Array(buf));
      const width = maxXyz[0] - minXyz[0];
      const depth = maxXyz[1] - minXyz[1];
      const height = maxXyz[2] - minXyz[2];
      card.innerHTML =
        `<div class="fname">${file.name}</div>` +
        `<div><span class="dim-label">가로 (X)</span>${width.toFixed(2)} mm</div>` +
        `<div><span class="dim-label">세로 (Y)</span>${depth.toFixed(2)} mm</div>` +
        `<div><span class="dim-label">높이 (Z)</span>${height.toFixed(2)} mm</div>`;
    } catch (err) {
      card.innerHTML = `<div class="fname">${file.name}</div><div class="error">오류: ${err.message}</div>`;
    }
    resultList.appendChild(card);
  }
});
</script>
</body>
</html>
