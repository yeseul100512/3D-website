<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="여러 부품의 G-code 파일을 하나로 합치고 프린터 베드 위에 자동 배치합니다. 높이 오름차순 병합, 설치 없이 브라우저에서 실행.">
<title>G-code 병합기 (베드 자동 배치)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #161826; --color-surface: #232532; --color-text: #e9e9ed;
    --color-accent: #9184d9; --color-accent-300: #d2cefd; --color-accent-400: #b5abfc;
    --color-accent-700: #5d5294; --color-accent-900: #2b2741;
    --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);
    --color-neutral-400: #b2b6ca; --color-neutral-500: #9397ab; --color-neutral-600: #75798c;
    --color-neutral-700: #595d6c; --color-neutral-800: #3f424d;
    --font-heading: 'Gowun Batang', 'Hiragino Mincho ProN', 'Songti SC', 'Inter', serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --radius-sm: 4px; --radius-md: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 22.4px 22.4px 33.6px; }
  .back { display: inline-flex; align-items: center; gap: 5.6px; margin-bottom: 16.8px; font-size: 12px; color: var(--color-neutral-500); text-decoration: none; }
  .back:hover { color: var(--color-accent-300); }
  .head { display: flex; align-items: flex-start; gap: 11.2px; margin-bottom: 16.8px; }
  .head i { font-size: 24px; color: var(--color-accent-400); margin-top: 2px; }
  .head h1 { flex: 1; margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: 20px; letter-spacing: -0.005em; }
  .badge { display: flex; align-items: center; gap: 5.6px; padding: 4px 10px; border: 1px solid var(--color-neutral-800); border-radius: 999px; background: var(--color-surface); }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  .badge span { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-500); }
  .hint-sub { margin: 0 0 16.8px; font-size: 12px; color: var(--color-neutral-500); line-height: 1.5; }

  .panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-content: start; align-items: start; gap: 16.8px 22.4px; padding: 16.8px; background: var(--color-surface); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-md); }
  .section { display: flex; flex-direction: column; gap: 8.4px; }
  .section h2 { margin: 0; padding-bottom: 5.6px; border-bottom: 1px solid var(--color-divider); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-300); font-weight: 500; }

  .upload { display: flex; align-items: center; gap: 11.2px; padding: 14px; border: 1px dashed var(--color-neutral-700); border-radius: var(--radius-md); background: color-mix(in srgb, var(--color-bg) 60%, transparent); cursor: pointer; }
  .upload:hover { border-color: var(--color-accent-700); }
  .upload i { font-size: 18px; color: var(--color-accent-400); flex-shrink: 0; }
  .upload .t { font-size: 13px; }
  .upload .n { font-size: 11px; color: var(--color-neutral-600); margin-top: 2px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

  .numrow { display: flex; align-items: center; gap: 11.2px; }
  .numrow label { flex: 1; font-size: 12px; color: var(--color-neutral-400); }
  .numrow .field { display: flex; align-items: center; gap: 5.6px; }
  .numrow input[type=number] { width: 76px; padding: 5px 8px; text-align: right; background: var(--color-bg); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-sm); color: var(--color-text); font-family: var(--font-body); font-size: 13px; outline: none; }
  .numrow input[type=number]:focus { border-color: var(--color-accent); }
  .numrow .unit { width: 42px; font-size: 11px; color: var(--color-neutral-600); }

  .hint { margin: 0; font-size: 11px; line-height: 1.5; color: var(--color-neutral-600); }
  .empty { padding: 14px; text-align: center; font-size: 12px; color: var(--color-neutral-700); border: 1px solid var(--color-divider); border-radius: var(--radius-sm); }

  .textsuffix { display: flex; align-items: center; background: var(--color-bg); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-sm); }
  .textsuffix:focus-within { border-color: var(--color-accent); }
  .textsuffix input { flex: 1; min-width: 0; padding: 6px 8px; background: transparent; border: none; outline: none; color: var(--color-text); font-family: var(--font-body); font-size: 13px; }
  .textsuffix span { padding: 0 9px 0 5.6px; font-size: 12px; color: var(--color-neutral-500); border-left: 1px solid var(--color-divider); align-self: stretch; display: flex; align-items: center; }
  .textsuffix-label { font-size: 12px; color: var(--color-neutral-400); }

  button.primary, button.ghost { width: 100%; display: flex; align-items: center; justify-content: center; gap: 5.6px; padding: 9px; border-radius: var(--radius-md); font-size: 13px; cursor: pointer; font-family: var(--font-body); }
  button.primary { background: transparent; color: var(--color-accent); border: 1px solid var(--color-accent); }
  button.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--color-accent) 14%, transparent); }
  button.primary:disabled { color: var(--color-neutral-600); border-color: var(--color-neutral-800); cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--color-neutral-400); border: 1px solid var(--color-neutral-800); }
  button.ghost:hover:not(:disabled) { border-color: var(--color-neutral-600); color: var(--color-text); }
  button.ghost:disabled { color: var(--color-neutral-700); cursor: not-allowed; }

  .file-list { display: flex; flex-direction: column; gap: 6px; }
  .file-row { display: flex; justify-content: space-between; align-items: center; background: var(--color-bg); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 12px; }
  .file-row button { width: auto; padding: 2px 8px; margin: 0; font-size: 11px; color: var(--color-neutral-500); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-sm); background: transparent; cursor: pointer; }
  .file-row button:hover { color: var(--color-text); border-color: var(--color-neutral-600); }
  #status { font-size: 12px; white-space: pre-wrap; line-height: 1.6; color: var(--color-neutral-400); }
  #status.error { color: #ff8a8a; }
  #status.ok { color: var(--color-accent-300); }
  .result-card { background: var(--color-bg); border: 1px solid var(--color-neutral-800); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 12px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../"><i class="ph ph-arrow-left"></i><span>전체 도구</span></a>

  <div class="head">
    <i class="ph ph-git-merge"></i>
    <h1>G-code 병합기</h1>
    <div class="badge"><span class="dot"></span><span>베드 자동 배치</span></div>
  </div>
  <p class="hint-sub">여러 부품의 g-code 파일을 하나로 합치고, 프린터 베드 위에 겹치지 않게 자동 배치한 뒤 높이 오름차순으로 순차 출력되도록 병합합니다.</p>

  <div class="panel">
    <div class="section">
      <label class="upload" for="fileInput">
        <i class="ph ph-upload-simple"></i>
        <div>
          <div class="t">G-code 파일 추가</div>
          <div class="n">.gcode · .gco · .g — 여러 개 선택 가능</div>
        </div>
      </label>
      <input type="file" id="fileInput" accept=".gcode,.gco,.g" multiple>
      <div class="file-list" id="fileList"><div class="empty">추가된 파일이 없습니다.</div></div>
    </div>

    <div class="section">
      <h2>프린터 출력 가능 크기</h2>
      <div class="numrow"><label>베드 가로 (X)</label><div class="field"><input type="number" id="pX" value="200" min="1"><span class="unit">mm</span></div></div>
      <div class="numrow"><label>베드 세로 (Y)</label><div class="field"><input type="number" id="pY" value="200" min="1"><span class="unit">mm</span></div></div>
      <div class="numrow"><label>최대 높이 (Z)</label><div class="field"><input type="number" id="pZ" value="200" min="1"><span class="unit">mm</span></div></div>
      <p class="hint">사용하는 프린터의 출력 가능 범위를 mm 단위로 입력하세요.</p>
    </div>

    <div class="section">
      <h2>옵션</h2>
      <div class="numrow"><label>안전이동 여유값</label><div class="field"><input type="number" id="clearance" value="5" min="0" step="0.5"><span class="unit">mm</span></div></div>
      <div class="numrow"><label>파츠 간 최소 간격</label><div class="field"><input type="number" id="margin" value="3" min="0" step="0.5"><span class="unit">mm</span></div></div>
      <p class="hint">높이 오름차순으로 순차 출력되도록 병합하고, 호밍은 시작 시 한 번만 실행합니다.</p>
    </div>

    <div class="section">
      <div>
        <div class="textsuffix-label" style="margin-bottom:5.6px;">저장할 파일 이름</div>
        <div class="textsuffix">
          <input type="text" id="outName" placeholder="combined" spellcheck="false">
          <span>.gcode</span>
        </div>
      </div>
      <p class="hint">비워 두면 combined.gcode 로 저장됩니다.</p>
      <button class="primary" id="runBtn" disabled><i class="ph ph-play"></i><span>병합 실행</span></button>
      <button class="ghost" id="dlBtn" disabled><i class="ph ph-download-simple"></i><span>이 이름으로 다운로드</span></button>
      <div id="status"></div>
      <div id="resultBox"></div>
    </div>
  </div>
</div>

<script>
// ===========================================================================
// gcode_parser.py / bin_packing.py / merger.py 포팅
// (js_harness.js로 원본 Python과 출력 일치 검증된 gcode_parser.js / bin_packing.js /
//  merger.js 로직을 그대로 가져오되, 파일 I/O만 fs 대신 File API / Blob 다운로드로 교체)
// ===========================================================================

// ---- gcode_parser ----
const MOVE_RE = /^(G0|G1)\b/i;
const PARAM_RE = /([XYZEF])(-?\d*\.?\d+)/gi;
const G28_RE = /^\s*G28\b/i;
const G92_E0_RE = /^\s*G92\s+E0(\.0*)?\b/i;

function codePart(line) {
  const idx = line.indexOf(";");
  return idx === -1 ? line : line.slice(0, idx);
}
function parseParams(codeAfterCmd) {
  const params = {};
  let m;
  PARAM_RE.lastIndex = 0;
  while ((m = PARAM_RE.exec(codeAfterCmd)) !== null) params[m[1].toUpperCase()] = parseFloat(m[2]);
  return params;
}

class GcodeInfo {
  constructor(lines) {
    this.minX = null; this.maxX = null; this.minY = null; this.maxY = null; this.maxZ = 0.0;
    this._parse(lines);
  }
  _parse(lines) {
    let absolute = true;
    const cur = { X: 0.0, Y: 0.0, Z: 0.0 };
    for (const raw of lines) {
      const code = codePart(raw).trim();
      if (!code) continue;
      const upper = code.toUpperCase();
      if (upper.startsWith("G90")) { absolute = true; continue; }
      if (upper.startsWith("G91")) { absolute = false; continue; }
      const m = MOVE_RE.exec(code);
      if (!m) continue;
      const params = parseParams(code.slice(m[0].length));
      if (absolute) { for (const axis of ["X", "Y", "Z"]) if (axis in params) cur[axis] = params[axis]; }
      else { for (const axis of ["X", "Y", "Z"]) if (axis in params) cur[axis] += params[axis]; }
      const eVal = "E" in params ? params.E : undefined;
      if (eVal !== undefined && eVal > 0) {
        const x = cur.X, y = cur.Y;
        if (this.minX === null) { this.minX = this.maxX = x; this.minY = this.maxY = y; }
        else {
          this.minX = Math.min(this.minX, x); this.maxX = Math.max(this.maxX, x);
          this.minY = Math.min(this.minY, y); this.maxY = Math.max(this.maxY, y);
        }
      }
      if (cur.Z > this.maxZ) this.maxZ = cur.Z;
    }
  }
  get width() { return this.minX === null ? 0.0 : this.maxX - this.minX; }
  get depth() { return this.minY === null ? 0.0 : this.maxY - this.minY; }
  get height() { return this.maxZ; }
}

function offsetLines(lines, dx, dy) {
  const result = [];
  let absolute = true;
  for (const raw of lines) {
    const semiIdx = raw.indexOf(";");
    const hasComment = semiIdx !== -1;
    const code = hasComment ? raw.slice(0, semiIdx) : raw;
    const comment = hasComment ? raw.slice(semiIdx + 1) : "";
    const stripped = code.trim();
    const upper = stripped.toUpperCase();
    if (upper.startsWith("G90")) { absolute = true; result.push(raw); continue; }
    if (upper.startsWith("G91")) { absolute = false; result.push(raw); continue; }
    const m = MOVE_RE.exec(stripped);
    if (!m || !absolute) { result.push(raw); continue; }
    const newCode = code.replace(/([XY])(-?\d*\.?\d+)/gi, (match, axis, valStr) => {
      const val = parseFloat(valStr);
      const upperAxis = axis.toUpperCase();
      if (upperAxis === "X") return `X${(val + dx).toFixed(4)}`;
      if (upperAxis === "Y") return `Y${(val + dy).toFixed(4)}`;
      return match;
    });
    result.push(newCode + (hasComment ? ";" + comment : ""));
  }
  return result;
}
function stripG28(lines) { return lines.filter((l) => !G28_RE.test(codePart(l))); }
function stripG92E0(lines) { return lines.filter((l) => !G92_E0_RE.test(codePart(l))); }

// ---- bin_packing ----
function packShelves(items, bedWidth, bedDepth, margin = 3.0) {
  const order = items.map((_, i) => i);
  order.sort((a, b) => items[b][1] - items[a][1]);
  const shelves = [];
  const placements = new Array(items.length).fill(null);
  const failedIndices = [];
  for (const i of order) {
    const [w, d] = items[i];
    const pw = w + margin, pd = d + margin;
    if (pw > bedWidth || pd > bedDepth) { failedIndices.push(i); continue; }
    let placed = false;
    for (const shelf of shelves) {
      if (pd <= shelf.height && shelf.usedWidth + pw <= bedWidth) {
        placements[i] = [shelf.usedWidth, shelf.y];
        shelf.usedWidth += pw;
        placed = true;
        break;
      }
    }
    if (placed) continue;
    const newY = shelves.length === 0 ? 0.0 : shelves[shelves.length - 1].y + shelves[shelves.length - 1].height;
    if (newY + pd > bedDepth) { failedIndices.push(i); continue; }
    shelves.push({ y: newY, height: pd, usedWidth: pw });
    placements[i] = [0.0, newY];
  }
  const success = failedIndices.length === 0;
  return { placements, success, failedIndices: [...failedIndices].sort((a, b) => a - b) };
}
function classifyFailure(w, d, bedWidth, bedDepth, margin) {
  if (w + margin > bedWidth || d + margin > bedDepth) return "too_large_alone";
  return "insufficient_space";
}
function suggestRemovals(items, bedWidth, bedDepth, margin = 3.0) {
  let remaining = items.map((_, i) => i);
  const removed = [];
  while (true) {
    const currentItems = remaining.map((i) => items[i]);
    const { success, failedIndices: failedLocal } = packShelves(currentItems, bedWidth, bedDepth, margin);
    if (success) return { removedIndices: removed, remainingFits: true };
    if (remaining.length === 0) return { removedIndices: removed, remainingFits: false };
    const failedGlobal = failedLocal.map((i) => remaining[i]);
    let worst = failedGlobal[0], worstArea = items[worst][0] * items[worst][1];
    for (const gi of failedGlobal) {
      const area = items[gi][0] * items[gi][1];
      if (area > worstArea) { worst = gi; worstArea = area; }
    }
    removed.push(worst);
    remaining = remaining.filter((i) => i !== worst);
  }
}

// ---- merger ----
class MergeError extends Error {}
const TRAVEL_FEED = 6000;

function buildPlacementErrorMessage(parts, items, bedW, bedD, margin, failed) {
  const failedNames = failed.map((i) => parts[i].name);
  const tooLarge = failed
    .filter((i) => classifyFailure(items[i][0], items[i][1], bedW, bedD, margin) === "too_large_alone")
    .map((i) => parts[i].name);
  const insufficient = failedNames.filter((n) => !tooLarge.includes(n));
  const lines = [
    `다음 파츠가 베드(${bedW.toFixed(0)}x${bedD.toFixed(0)}mm, margin=${margin.toFixed(1)}mm)에 배치되지 않습니다: ${failedNames.join(", ")}.`,
    "일부만 병합하지 않고 전체 작업을 중단합니다.",
  ];
  if (tooLarge.length) lines.push(`- 베드보다 파츠 자체가 커서 이 프린터에서는 배치할 수 없음: ${tooLarge.join(", ")} (더 큰 베드 크기를 입력하세요)`);
  if (insufficient.length) lines.push(`- 다른 파츠들과 함께면 공간이 부족해 배치되지 못함: ${insufficient.join(", ")}`);
  const { removedIndices, remainingFits } = suggestRemovals(items, bedW, bedD, margin);
  const removedNames = removedIndices.map((i) => parts[i].name);
  if (removedNames.length && remainingFits) {
    const kept = parts.length - removedNames.length;
    lines.push(`추천: 다음 ${removedNames.length}개 파일을 목록에서 제외하면 나머지 ${kept}개는 배치 가능합니다 → ${removedNames.join(", ")}`);
  } else if (!remainingFits) {
    lines.push("일부를 제외해도 전부 배치할 방법이 없습니다. 더 큰 베드 크기를 입력하세요.");
  }
  return lines.join("\n");
}

function mergeGcodeFiles(bedW, bedD, bedH, parts, clearance, margin) {
  const tooTall = parts.filter((p) => p.info.height > bedH).map((p) => p.name);
  if (tooTall.length) throw new MergeError(`다음 파츠의 높이가 최대 높이(${bedH}mm)를 초과합니다: ${tooTall.join(", ")}. 배치를 중단합니다.`);

  const items = parts.map((p) => [p.info.width, p.info.depth]);
  const { placements, success, failedIndices } = packShelves(items, bedW, bedD, margin);
  if (!success) throw new MergeError(buildPlacementErrorMessage(parts, items, bedW, bedD, margin, failedIndices));

  const order = parts.map((_, i) => i);
  order.sort((a, b) => parts[a].info.height - parts[b].info.height);

  const outLines = [
    "G21                         ; 단위 mm\n",
    "G90                         ; 절대좌표\n",
    "M82                         ; 절대 압출\n",
    "G28                         ; 전체 작업 시작 시 1회만 호밍\n",
    "\n",
  ];
  let runningMaxHeight = 0.0;
  const results = [];
  for (const i of order) {
    const part = parts[i], info = part.info;
    const [x, y] = placements[i];
    const dx = x - (info.minX !== null ? info.minX : 0.0);
    const dy = y - (info.minY !== null ? info.minY : 0.0);
    const safeZ = runningMaxHeight + clearance;
    let body = stripG92E0(stripG28(part.lines));
    body = offsetLines(body, dx, dy);
    outLines.push(`; ===PART ${part.name} h=${info.height.toFixed(3)} x=${x.toFixed(3)} y=${y.toFixed(3)}===\n`);
    outLines.push("G92 E0\n");
    outLines.push(`G0 Z${safeZ.toFixed(3)} F${TRAVEL_FEED}        ; 안전고도로 이동\n`);
    outLines.push(`G0 X${x.toFixed(3)} Y${y.toFixed(3)} F${TRAVEL_FEED}\n`);
    outLines.push(...body);
    outLines.push("\n");
    runningMaxHeight = Math.max(runningMaxHeight, info.height);
    results.push({ name: part.name, width: info.width, depth: info.depth, height: info.height, x, y });
  }
  const finalSafeZ = runningMaxHeight + clearance;
  outLines.push(`G0 Z${finalSafeZ.toFixed(3)}            ; 완료 후 헤드 들어올리기\n`);
  outLines.push("M104 S0\n");
  outLines.push("M140 S0\n");
  outLines.push("M84                         ; 스테퍼 모터 끄기\n");

  return { results, combinedText: outLines.join("") };
}

// ===========================================================================
// UI
// ===========================================================================
let selectedFiles = [];
let mergedText = null;
const fileInput = document.getElementById('fileInput');
const fileListEl = document.getElementById('fileList');
const runBtn = document.getElementById('runBtn');
const dlBtn = document.getElementById('dlBtn');
const outName = document.getElementById('outName');
const statusEl = document.getElementById('status');
const resultBox = document.getElementById('resultBox');

function renderFileList() {
  fileListEl.innerHTML = '';
  if (!selectedFiles.length) {
    fileListEl.innerHTML = '<div class="empty">추가된 파일이 없습니다.</div>';
  } else {
    selectedFiles.forEach((f, i) => {
      const row = document.createElement('div');
      row.className = 'file-row';
      row.innerHTML = `<span>${f.name}</span>`;
      const btn = document.createElement('button');
      btn.textContent = '제거';
      btn.onclick = () => { selectedFiles.splice(i, 1); renderFileList(); };
      row.appendChild(btn);
      fileListEl.appendChild(row);
    });
  }
  runBtn.disabled = selectedFiles.length < 1;
}

fileInput.addEventListener('change', (e) => {
  selectedFiles = selectedFiles.concat(Array.from(e.target.files));
  fileInput.value = '';
  renderFileList();
});

function nameWithoutExt(fname) {
  const idx = fname.lastIndexOf('.');
  return idx === -1 ? fname : fname.slice(0, idx);
}

function downloadFilename() {
  const typed = outName.value.trim();
  return (typed || 'combined') + '.gcode';
}

runBtn.addEventListener('click', async () => {
  runBtn.disabled = true;
  dlBtn.disabled = true;
  mergedText = null;
  statusEl.className = '';
  statusEl.textContent = '병합 중...';
  resultBox.innerHTML = '';

  try {
    const parts = [];
    for (const file of selectedFiles) {
      const text = await file.text();
      const lines = text.split(/(?<=\n)/);
      parts.push({ name: nameWithoutExt(file.name), lines, info: new GcodeInfo(lines) });
    }

    const bedW = parseFloat(document.getElementById('pX').value);
    const bedD = parseFloat(document.getElementById('pY').value);
    const bedH = parseFloat(document.getElementById('pZ').value);
    const clearance = parseFloat(document.getElementById('clearance').value);
    const margin = parseFloat(document.getElementById('margin').value);

    const { results, combinedText } = mergeGcodeFiles(bedW, bedD, bedH, parts, clearance, margin);
    mergedText = combinedText;

    statusEl.className = 'ok';
    statusEl.textContent = `완료 — ${results.length}개 파츠를 높이 오름차순으로 병합했습니다.`;

    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = results
      .map((r) => `${r.name}: ${r.width.toFixed(1)}×${r.depth.toFixed(1)}×${r.height.toFixed(1)}mm @ (${r.x.toFixed(1)}, ${r.y.toFixed(1)})`)
      .join('<br>');
    resultBox.appendChild(card);

    dlBtn.disabled = false;
  } catch (err) {
    statusEl.className = 'error';
    statusEl.textContent = err instanceof MergeError ? `배치 실패:\n${err.message}` : `오류: ${err.message}`;
  } finally {
    runBtn.disabled = selectedFiles.length < 1;
  }
});

dlBtn.addEventListener('click', () => {
  if (!mergedText) return;
  const blob = new Blob([mergedText], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = downloadFilename();
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

renderFileList();
</script>
</body>
</html>
